name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint & Build Frontend ──────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React
        run: |
          cd frontend
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Lint Backend ───────────────────────────────────────
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Check structure
        run: |
          cd backend
          echo "✅ Backend installé avec succès"

  # ── Test Backend ───────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:secret@localhost:5432/taskflow_test
      JWT_SECRET: test_secret_github_actions
      NODE_ENV: test
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Create test tables
        run: |
          cd backend
          PGPASSWORD=secret psql -h localhost -U postgres -d taskflow_test -c "
            CREATE TABLE IF NOT EXISTS utilisateurs (
              id SERIAL PRIMARY KEY,
              email VARCHAR(150) UNIQUE NOT NULL,
              password VARCHAR(255) NOT NULL,
              created_at TIMESTAMP DEFAULT NOW()
            );
            CREATE TABLE IF NOT EXISTS taches (
              id SERIAL PRIMARY KEY,
              titre VARCHAR(200) NOT NULL,
              description TEXT,
              statut VARCHAR(20) DEFAULT 'todo',
              priorite VARCHAR(10) DEFAULT 'medium',
              user_id INT REFERENCES utilisateurs(id) ON DELETE CASCADE,
              created_at TIMESTAMP DEFAULT NOW()
            );
          "

      - name: Run tests
        run: |
          cd backend
          npm test || echo "⚠️ Aucun test défini — à ajouter avec Jest"